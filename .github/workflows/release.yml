name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate version and test
        env:
          TAG: ${{ github.ref_name }}
        run: |
          test "$TAG" = "v$(python3 -c 'import json; print(json.load(open("manifest.json"))["version"])')"
          node --check background.js
          node --check exclusions.js
          node --check options.js
          node --test tests/*.test.cjs
      - name: Package extension
        run: python3 scripts/package.py && unzip -t dist/*.zip
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.zip --clobber
          else
            gh release create "$TAG" dist/*.zip --verify-tag --generate-notes --title "$TAG"
          fi
